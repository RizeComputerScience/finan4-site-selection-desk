<style>
:root{color-scheme:light;
  --bg:#F7F5F0;--surface:#FFFFFF;--panel:#EEEBE3;--line:#D9D4C8;--line-strong:#8A8475;
  --ink:#1B211D;--muted:#5C625D;--brand:#1C6B4A;--brand-ink:#FFFFFF;--brand-tint:#E2F0E8;
  --ok:#1C7340;--ok-tint:#E0F2E5;--bad:#A8261E;--bad-tint:#FBE7E4;--hint:#3B5469;--hint-tint:#E5ECF2;--focus:#1B211D;--hl:#FFF1B8;

  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#121815;--surface:#18201C;--panel:#1F2924;--line:#2F3B35;--line-strong:#71807A;
  --ink:#E9EEEA;--muted:#AEBAB3;--brand:#7DD49A;--brand-ink:#0F1512;--brand-tint:#1B3326;
  --ok:#7DD49A;--ok-tint:#173324;--bad:#FF8D84;--bad-tint:#42201E;--hint:#A8BCCE;--hint-tint:#1C2A36;--focus:#E9EEEA;--hl:#4A4220;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.6 var(--serif);font-variant-numeric:lining-nums tabular-nums}

.skip{position:absolute;left:-9999px;top:0;background:var(--brand);color:var(--brand-ink);padding:.6rem 1rem;z-index:10}
.skip:focus{left:0}
header.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:820px;margin:0 auto;padding:.55rem 1.1rem;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.brand{font-style:italic;color:var(--muted);font-size:16px;margin-right:auto}

.btn-quiet{font:15px var(--serif);background:none;border:1px solid var(--line-strong);color:var(--ink);border-radius:6px;padding:.3rem .7rem;cursor:pointer}

.btn-calc{text-decoration:none;display:inline-block;font:700 15px var(--serif);background:var(--brand);color:var(--brand-ink);border:0;border-radius:6px;padding:.4rem .85rem;cursor:pointer}
nav.steps{max-width:820px;margin:0 auto;padding:0 1.1rem .55rem;overflow-x:auto}

nav.steps button{font:14px var(--serif);border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:.2rem .7rem;cursor:pointer}
nav.steps button.done{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
nav.steps button.done::before{content:"✓ "}
nav.steps button[aria-current="step"]{outline:2px solid var(--ink);outline-offset:2px}

table.cf th{font:700 14px var(--serif);text-align:right;padding:.35rem .6rem;border-bottom:1.5px solid var(--line-strong);vertical-align:bottom}

table.cf tfoot td[colspan]{white-space:normal;text-align:left}

@media (max-width:680px){header.bar{position:static}.pair{grid-template-columns:1fr}table.cf{font-size:13px}table.cf input{width:6.4rem;font-size:13px}table.cf th,table.cf td{padding:.3rem .2rem}table.cf th{font-size:12.5px}.today{display:none}.memo{padding:1.1rem .8rem}table.cf .mark{width:.9em}}
.formula{font:500 16px var(--mono);background:var(--panel);border-radius:6px;padding:.6rem .8rem;margin:.6rem 0;line-height:1.7}.formula span{white-space:nowrap}
.ask{margin-top:1.2rem;display:grid;gap:1rem}
fieldset{border:0;padding:0;margin:0}
legend{font-weight:700;font-size:16px;margin-bottom:.35rem}
.choices{display:flex;gap:.6rem;flex-wrap:wrap}
.choices.stack{flex-direction:column;align-items:flex-start}
.choice{position:relative}
.choice input{position:absolute;opacity:0;inset:0}
.choice span{display:inline-block;border:1.5px solid var(--line-strong);border-radius:999px;padding:.35rem 1rem;font-size:16px;cursor:pointer;background:var(--surface)}
.choices.stack .choice span{border-radius:8px;text-align:left}

.fb b{font-weight:700}
.attempts{font-size:14px;color:var(--muted)}
.q{border-top:1px solid var(--line);padding:1rem 0 .4rem}
.q:first-of-type{border-top:0}
.small{font-size:15px;color:var(--muted)}
.slider-wrap{margin:1rem 0}
input[type=range]{width:100%;max-width:30rem;accent-color:var(--brand)}
.readout{font:500 18px var(--mono)}
svg.curve{width:100%;max-width:36rem;height:auto;display:block;background:var(--panel);border-radius:8px;margin:.6rem 0}
svg.curve text{font:13px var(--serif);fill:var(--muted)}
.cert-preview{max-width:100%;border:1px solid var(--line);border-radius:6px;margin:1rem 0;display:block}
ul.check{list-style:none;padding:0;margin:.6rem 0 1rem}
ul.check li{display:flex;gap:.6rem;align-items:center;padding:.3rem 0;border-bottom:1px solid var(--line)}
ul.check .st{font:500 14px var(--mono);min-width:5.5rem}
ul.check .st.ok{color:var(--ok)}ul.check .st.no{color:var(--bad)}
.points{font:400 44px/1 var(--display);margin:.2rem 0 .6rem}
.wc{font-size:14px;color:var(--muted)}
/* calculator: a link to Desmos */
.calc-strip{margin:1.1rem 0 .4rem;padding:.6rem .8rem;border-left:4px solid var(--brand);background:var(--panel);border-radius:0 8px 8px 0}
.calc-strip .small{margin:.45rem 0 0}
footer{max-width:820px;margin:0 auto;padding:0 1.1rem 3rem;font-size:14px;color:var(--muted)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;margin:1.75rem 0 0;padding-top:1.1rem;border-top:1px solid var(--line)}.pager[hidden]{display:none}
#nextRow{display:none}
.practice-banner{background:var(--hint-tint);border-left:4px solid var(--hint);padding:.6rem .9rem;border-radius:6px;margin:0 0 1rem}
/* 2026-11-06 (Samuel's 11/05 desk rules): worked example per site, each answer field under its own question */
details.example{background:var(--brand-tint);border-left:4px solid var(--brand);border-radius:8px;padding:.55rem 1rem .6rem;margin:1rem 0}
details.example summary{cursor:pointer;font-weight:700;font-size:16px;color:var(--brand)}
details.example .ex-body{font-size:16.5px}
details.example .ex-body p{margin:.3rem 0}
.part>p:first-child{margin-top:0}
.part>.field,.part>fieldset,.part>.tw{margin-top:.6rem}
.part+.part{border-top:1px solid var(--line);padding-top:1rem}
.part .tw table.cf{margin-top:.2rem}
table.cf tfoot td[colspan]{font-family:var(--serif);font-size:15px;line-height:1.35}
table.cf th small{display:block;font-weight:400;color:var(--muted)}
</style>

<body>
<a class="skip" href="#main">Skip to the desk</a>
<header class="bar">
  <div class="bar-in">
    <div class="brand" id="brand"></div>
    <a class="btn-calc desmos-open" id="calcBtn" href="https://www.desmos.com/scientific" target="desmos" rel="noopener">Desmos calculator<span class="sr-only"> (opens in a new window)</span></a>
    <button class="btn-quiet" id="themeBtn" type="button" aria-pressed="false">Dark mode</button>
  </div>
  <nav class="steps" aria-label="Steps"><ol id="stepNav"></ol></nav>
  <p class="navnote" id="navnote" hidden>Move between steps at any time. Finished steps turn green.</p>
</header>
<main id="main" tabindex="-1">
  <div id="view"></div>
</main>
<footer><p>Corporate Finance, Unit 5. Your progress is saved in this browser.</p></footer>
<div class="sr-only" aria-live="polite" id="announce"></div>
<script src="desk-core.js"></script>
<script>
/* ===== selfcheck.js (copied verbatim from the interactive-health template) ===== */
window.SelfCheck = (function () {
  const checks = [];
  return {
    register(name, fn) { checks.push({ name, fn }); },
    async run() {
      const out = [];
      for (const c of checks) {
        try {
          const r = await c.fn();
          if (r === true || r === undefined) out.push({ name: c.name, ok: true });
          else if (r === false) out.push({ name: c.name, ok: false, detail: 'returned false' });
          else out.push({ name: c.name, ok: !!r.ok, detail: r.detail });
        } catch (e) {
          out.push({ name: c.name, ok: false, detail: String(e) });
        }
      }
      return { ok: out.every((c) => c.ok), checks: out };
    },
  };
})();
window.__selfCheck = () => window.SelfCheck.run();
</script>
<script>
(function () {
'use strict';
const D = window.Desk, ST = D.STORY;
const VERIFY_URL = 'https://rizecomputerscience.github.io/finan4-site-selection-desk/verify.html';
const KEY = 'rize-finan4-desk-v2';
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => [...(el || document).querySelectorAll(s)];
const view = $('#view');
const fmt = D.money;
const pct = D.pct;
const f4 = (x) => x.toFixed(4);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode: progress lives for this visit only */ } },
};
$('#brand').innerHTML = `<b>${esc(ST.company)}</b> ${esc(ST.team)}`;
const PERSONAL = /@(gmail|yahoo|hotmail|outlook|live|icloud|me|aol|proton|protonmail|msn|ymail)\./i;

// ---------- theme ----------
const themeBtn = $('#themeBtn');
function setTheme(t) {
  if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); else document.documentElement.removeAttribute('data-theme');
  themeBtn.textContent = t === 'dark' ? 'Light mode' : 'Dark mode';
  themeBtn.setAttribute('aria-pressed', t === 'dark' ? 'true' : 'false');
  store.set(KEY + ':theme', t);
}
setTheme(store.get(KEY + ':theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
themeBtn.addEventListener('click', () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

// ---------- calculator: Desmos (Samuel, 11/10) ----------
// The Desmos scientific calculator opens in its own window beside the desk; the in-page keypad was retired.
// Embedding Desmos inside the page needs a paid licence; linking out is free. If the popup is blocked, the link opens a tab.
const DESMOS = 'https://www.desmos.com/scientific';
function openDesmos(e) {
  const W = 440, sc = window.screen || {}, aw = sc.availWidth || 1280, ah = sc.availHeight || 800;
  const left = Math.max(0, (sc.availLeft || 0) + aw - W), top = sc.availTop || 0;
  let w = null; try { w = window.open(DESMOS, 'desmos', `popup,width=${W},height=${Math.min(ah, 760)},left=${left},top=${top}`); } catch (err) { w = null; }
  if (w) { e.preventDefault(); try { w.opener = null; w.focus(); } catch (err) { /* cross-origin */ } }
}
document.addEventListener('click', (e) => { const a = e.target.closest && e.target.closest('a.desmos-open'); if (a) openDesmos(e); });
function dockCalc(slot) {
  if (!slot) return;
  slot.innerHTML = `<div class="calc-strip"><a class="btn small secondary desmos-open" href="${DESMOS}" target="desmos" rel="noopener">Open the Desmos calculator<span class="sr-only"> (opens in a new window)</span></a>
    <p class="small">For example, 330000/(1.08)^5 is $330,000 in year 5 brought back at 8%. In Desmos, typing <b>/</b> starts a fraction, and everything you type next goes under the line until you press <b>→</b>.</p></div>`;
}

// ---------- state ----------
let S = { name: '', email: '', sites: [], log: {}, memo: '', at: 'start' };
function blankLog() { const l = {}; D.STEPS.forEach((s) => { l[s.id] = { done: false, attempts: 0, help: 0 }; }); return l; }
function saveState() { if (S.practice) return; store.set(KEY + ':' + D.seedFor(S.email), { name: S.name, email: S.email, log: S.log, memo: S.memo, memoDraft: S.memoDraft, at: S.at }); store.set(KEY + ':last', S.email); }
function startFor(name, email) {
  S.name = name.trim(); S.email = D.normEmail(email); S.sites = D.buildSites(S.email);
  const saved = store.get(KEY + ':' + D.seedFor(S.email));
  S.log = saved && saved.log ? saved.log : blankLog();
  D.STEPS.forEach((s) => { if (!S.log[s.id]) S.log[s.id] = { done: false, attempts: 0, help: 0 }; });
  S.memo = saved && saved.memo ? saved.memo : '';
  S.memoDraft = saved && saved.memoDraft != null ? saved.memoDraft : S.memo; // what the box shows; S.memo is what the receipt carries
  if (saved && saved.name && !name.trim()) S.name = saved.name;
  S.at = saved && saved.at ? saved.at : 'walk';
  saveState();
}
const doneCount = () => D.STEPS.filter((s) => S.log[s.id] && S.log[s.id].done).length;
const siteById = (id) => S.sites.find((s) => s.id === id);
function markDone(id) { const L = S.log[id]; if (!L.done) { L.done = true; L.at = new Date().toISOString(); } saveState(); renderNav(); }

// ---------- step nav ----------
function renderNav() {
  const ol = $('#stepNav'); ol.innerHTML = '';
  $('#navnote').hidden = !S.email;
  if (!S.email) return;
  [...D.STEPS, { id: 'receipt', label: 'Receipt' }].forEach((s, i) => {
    const li = document.createElement('li'); const b = document.createElement('button'); b.type = 'button';
    b.textContent = s.label;
    const done = s.id === 'receipt' ? doneCount() === D.STEPS.length : S.log[s.id].done;
    if (done) b.classList.add('done');
    if (S.at === s.id) b.setAttribute('aria-current', 'step');
    b.setAttribute('aria-label', s.label + (s.id === 'receipt' ? '' : done ? ', finished' : ', not finished yet'));
    b.addEventListener('click', () => go(s.id));
    li.appendChild(b); ol.appendChild(li);
  });
  const cur = ol.querySelector('[aria-current]'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
function renderPager(id) {
  let pg = document.getElementById('pager');
  if (!pg) { pg = document.createElement('nav'); pg.id = 'pager'; pg.className = 'pager'; pg.setAttribute('aria-label', 'Previous and next step'); view.after(pg); }
  const all = D.STEPS.map((s) => ({ id: s.id, label: s.label })).concat([{ id: 'receipt', label: 'Receipt' }]);
  const i = all.findIndex((s) => s.id === id);
  if (i < 0) { pg.hidden = true; pg.innerHTML = ''; return; }
  const prev = i > 0 ? all[i - 1] : null, next = i < all.length - 1 ? all[i + 1] : null;
  pg.hidden = false;
  pg.innerHTML = (prev ? `<button type="button" class="btn secondary" data-go="${prev.id}">← Previous: ${esc(prev.label)}</button>` : '<span></span>')
    + (next ? `<button type="button" class="btn" data-go="${next.id}">Next: ${esc(next.label)} →</button>` : '');
  pg.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => go(b.dataset.go)));
}
function go(id) {
  if (!S.email) return showStart();
  S.at = id; saveState();
  if (id === 'walk') showWalk();
  else if (D.STEPS.find((x) => x.id === id && x.quiz != null)) showCheck(D.STEPS.find((x) => x.id === id));
  else if (id === 'memo') showMemo();
  else if (id === 'receipt') showReceipt();
  else showSite(siteById(id));
  renderNav(); renderPager(id);
  if (S.practice) view.insertAdjacentHTML('afterbegin', `<p class="practice-banner"><b>Practice round ${S.practice}.</b> New numbers, not graded. Your receipt is unchanged.</p>`);
  $('#main').focus({ preventScroll: true });
  window.scrollTo(0, 0);
}
function nextId(id) { const i = D.STEPS.findIndex((s) => s.id === id); return i < D.STEPS.length - 1 ? D.STEPS[i + 1].id : 'receipt'; }
function nextLabel(id) { const n = nextId(id); return n === 'receipt' ? 'Go to your receipt' : 'Next: ' + D.STEPS.find((s) => s.id === n).label; }
function memoHead(done) { return `<div class="memo-head"><span>From <b>${esc(ST.vp)}</b>, ${esc(ST.vpTitle)}</span>${done ? '<span class="stamp">Done</span>' : ''}</div>`; }

// ---------- start ----------
function showStart() {
  if (document.getElementById('pager')) document.getElementById('pager').hidden = true;
  S.at = 'start';
  const last = store.get(KEY + ':last');
  const lastSaved = last ? store.get(KEY + ':' + D.seedFor(last)) : null;
  view.innerHTML = `
    <p class="kicker">Corporate Finance, Unit 5</p>

// ---------- worked example ----------
const WALK_STAGES = [
  { t: 'Lay out the years', p: 'Year 0 is today. That is when the company pays to build, so the cost goes in year 0 as a negative number: cash going out. Year 1 is one year from now, after the first year of sales. Each year’s cash is counted at the end of that year.' },
  { t: 'Find each year’s discount factor', p: 'The discount factor for year t is 1 ÷ (1 + r)<sup>t</sup>. At 10%, year 1 is 1 ÷ 1.10 = 0.9091. For year 0 the exponent is 0, so the factor is exactly 1: cash today counts at its full amount.' },
  { t: 'Multiply to get each present value', p: 'Present value = cash flow × discount factor. It is what that year’s cash is worth today.' },
  { t: 'Add up the cash coming in', p: '200,000 + 181,818 + 165,289 = 547,107. Three years of cash are worth $547,107 today, even though they add up to $660,000.' },
  { t: 'Subtract the cost: that is the NPV', p: '547,107 − 500,000 = 47,107. This is the same calculation as the NPV formula on the resource page, one row at a time:' },
  { t: 'Make the call', p: 'The NPV is above zero, so this site earns more than the 10% the company requires and adds about $47,107 of value. <b>Build it.</b>' },
];
function showWalk() {
  const L = S.log.walk;
  const stage = Math.min(L.stage || 0, WALK_STAGES.length - 1);
  const W = D.WALK, r = W.r;
  const showF = stage >= 1, showPV = stage >= 2, showSum = stage >= 3, showNpv = stage >= 4;
  const rows = W.flows.map((cf, t) => {
    const f = D.df(r, t);
    return `<tr class="${stage === 2 || stage === 1 ? 'reveal' : ''}"><td>${t}${t === 0 ? '<span class="today"> (today)</span>' : ''}</td><td class="${cf < 0 ? 'neg' : ''}">${fmt(cf)}</td>
      <td>${showF ? f4(f) + `<span class="ex">${t === 0 ? '1.10⁰ = 1' : '1 ÷ 1.10' + (t > 1 ? ['', '', '²', '³'][t] : '')}</span>` : ''}</td>
      <td class="${cf < 0 ? 'neg' : ''}">${showPV ? fmt(cf * f) + `<span class="ex">${(cf < 0 ? '−' : '') + Math.abs(cf).toLocaleString('en-US')} × ${f4(f)}</span>` : ''}</td></tr>`;
  }).join('');
  const foot = `${showSum ? `<tr class="total"><td colspan="3">Value today of the cash coming in (years 1 to 3)</td><td>${fmt(D.pvIn(r, W.flows))}</td></tr>` : ''}
    ${showNpv ? `<tr><td colspan="3">Cost today (year 0)</td><td class="neg">${fmt(W.flows[0])}</td></tr><tr class="total hl"><td colspan="3"><b>NPV</b></td><td><b>${fmt(D.npv(r, W.flows))}</b></td></tr>` : ''}`;
  view.innerHTML = `<p class="kicker">Step 1 of ${D.STEPS.length} · Worked example</p>
    <article class="memo" aria-labelledby="t">${memoHead(L.done)}
      <h2 id="t">How we check a site</h2>
      <p>Before you take your own sites, here is one from last year, worked one step at a time. A small storefront in a strip mall cost <b>$500,000</b> to build and was expected to bring in <b>$220,000</b> of cash at the end of each of the next three years. Our required return was <b>10%</b> a year.</p>
      <div class="tw"><table class="cf"><caption>Strip mall storefront, required return 10%</caption>
        <thead><tr><th scope="col">Year</th><th scope="col">Cash flow</th><th scope="col">Discount factor</th><th scope="col">Present value</th></tr></thead>
        <tbody>${rows}</tbody><tfoot>${foot}</tfoot></table></div>
      <ol class="walk-steps" style="padding-left:1.3rem">${WALK_STAGES.slice(0, stage + 1).map((s, i) => `<li class="${i === stage ? 'reveal' : ''}"><b>${s.t}.</b> ${s.p}${i === 4 ? `<div class="formula"><span>NPV = −500,000</span> <span>+ 220,000 ÷ 1.10</span> <span>+ 220,000 ÷ 1.10²</span> <span>+ 220,000 ÷ 1.10³</span> <span>= 47,107</span></div>` : ''}</li>`).join('')}</ol>
      <div class="actions">${stage < WALK_STAGES.length - 1 ? `<button class="btn" type="button" id="walkNext">Show the next step (${stage + 2} of ${WALK_STAGES.length})</button>` : `<button class="btn" type="button" id="walkDone">${L.done ? nextLabel('walk') : 'I’ve got it. ' + nextLabel('walk')}</button>`}
      ${stage > 0 ? '<button class="btn secondary" type="button" id="walkReset">Start the example over</button>' : ''}</div>
    </article>`;
  if ($('#walkNext')) $('#walkNext').addEventListener('click', () => { L.stage = stage + 1; saveState(); showWalk(); $('#walkNext') ? $('#walkNext').focus() : $('#walkDone').focus(); });
  if ($('#walkDone')) $('#walkDone').addEventListener('click', () => { markDone('walk'); go(nextId('walk')); });
  if ($('#walkReset')) $('#walkReset').addEventListener('click', () => { L.stage = 0; saveState(); showWalk(); });
}

// ---------- one-question checks (quick wins between sites) ----------
const CHECK_TITLES = ['Quick win: what is year 0?', 'Quick win: what does NPV tell you?', 'Quick win: when the required return rises', 'Exam-style question'];
const optOrder = (q) => { const hs = (s) => { let x = 2166136261; for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619) >>> 0; } return x; }; return q.options.map((_, j) => j).sort((a, b) => hs(q.q + '|' + a) - hs(q.q + '|' + b)); };
function showCheck(step) {
  const L = S.log[step.id], q = D.QUIZ[step.quiz], idx = D.STEPS.findIndex((x) => x.id === step.id) + 1;
  const cur = L.choice != null ? Number(L.choice) : null;
  view.innerHTML = `<p class="kicker">Step ${idx} of ${D.STEPS.length} · ${esc(step.label)}</p>
    <article class="memo" aria-labelledby="t">${memoHead(L.done)}
      <h2 id="t">${esc(CHECK_TITLES[step.quiz])}</h2>
      <form id="qf" novalidate><fieldset><legend>${esc(q.q)}</legend>
        <div class="choices stack">${optOrder(q).map((j) => `<label class="choice"><input type="radio" name="q" value="${j}" ${cur === j ? 'checked' : ''}><span>${esc(q.options[j])}</span></label>`).join('')}</div></fieldset>
        <div class="actions"><button class="btn" type="submit">Check</button><span class="attempts" id="att">${L.attempts ? 'Checks so far: ' + L.attempts : ''}</span></div>
        <div class="fb" id="fb" aria-live="polite"></div>
        <div class="actions" id="nextRow" ${L.done ? '' : 'hidden'}><button class="btn" type="button" id="nextBtn">${nextLabel(step.id)}</button></div>
      </form></article>`;
  $('#qf').addEventListener('submit', (e) => {
    e.preventDefault();
    const c = $('input[name=q]:checked'); const fb = $('#fb');
    if (!c) { fb.className = 'fb bad'; fb.textContent = 'Choose an answer.'; return; }
    const pick = Number(c.value); L.attempts = (L.attempts || 0) + 1;
    const ok = D.judgeQuiz(step.quiz, pick).ok;
    if (ok || !L.done) L.choice = pick; // a finished check keeps its right answer
    fb.className = 'fb ' + (ok ? 'ok' : 'bad'); fb.textContent = q.why[pick] + (!ok && L.done ? ' Your earlier right answer is still saved.' : '');
    if (ok) { markDone(step.id); $('#nextRow').hidden = false; (document.querySelector('#pager [data-go]:not(.secondary)') || $('#nextBtn')).focus(); }
    $('#att').textContent = 'Checks so far: ' + L.attempts;
    saveState();
  });
  $('#nextBtn').addEventListener('click', () => go(nextId(step.id)));
}

// ---------- site copy ----------
// Each site: body (the facts), example (a 2 to 4 line worked example with fixed round numbers that no student's site uses),
// and its questions, each rendered directly above its own answer field.
function siteCopy(s) {
  const n = (s.flows || s.bFlows).length - 1;
  switch (s.id) {
    case 's1': return { title: `Site 1: ${s.city}`, place: 'A former bank branch on a busy corner, with the drive-thru lane still in place.', body: `
      <p>Converting the branch costs <b>${fmt(-s.flows[0])}</b> today. The restaurant should bring in <b>${fmt(s.flows[1])}</b> of cash at the end of each year for ${n} years. Our required return is <b>${pct(s.r)}</b>.</p>`,
      example: `<p>Year 2 cash of $100,000, required return 5%.</p>
        <p>Discount factor = 1 ÷ 1.05² = 0.9070.</p>
        <p>Present value = cash flow × discount factor = $100,000 × 0.9070 = $90,700.</p>
        <p>NPV = sum of the present values − cost today. Above zero, build; below zero, pass.</p>`,
      tableQ: `<p><b>1. What is each year’s present value?</b> Type it in the Present value column: cash flow × discount factor. The table adds them up and subtracts the cost for you.</p>`,
      choiceQ: '2. Should we build this site?' };
    case 's2': return { title: `Site 2: ${s.city}`, place: 'An end unit in a brand-new shopping center that is still signing tenants.', body: `
      <p>Until the rest of the center opens, traffic will be light, so the first two years bring in less cash. It costs <b>${fmt(-s.flows[0])}</b> to build today. Our required return is <b>${pct(s.r)}</b>.</p>
      <p>The Present value column is optional. Fill it in and the table works out the NPV for you.</p>`,
      example: `<p>Cost $100,000 today, then $40,000 in year 1 and $80,000 in year 2, required return 5%.</p>
        <p>Year 1: $40,000 × 0.9524 = $38,096.</p>
        <p>Year 2: $80,000 × 0.9070 = $72,560.</p>
        <p>NPV = $38,096 + $72,560 − $100,000 = $10,656. Above zero, so build.</p>`,
      valueQ: `1. What is this site’s NPV at ${pct(s.r)}?`, choiceQ: '2. Should we build this site?' };
    case 's3': return { title: `Site 3: ${s.city}`, place: 'A ground-floor space across the street from a twelve-screen movie theater.', body: `
      <p>Last year, when our required return was ${pct(s.r0)}, the team valued this site at an NPV of <b>${fmt(s.oldNpv)}</b> and planned to build it. Since then interest rates have gone up, and our investors now expect <b>${pct(s.r)}</b>. The estimates have not changed: it costs <b>${fmt(-s.flows[0])}</b> today and brings in <b>${fmt(s.flows[1])}</b> a year for ${n} years.</p>
      <p>The discount factors are not filled in this time. In Desmos, the year 2 factor is <code>1/(1+${(s.r).toFixed(2).replace(/0$/, '')})^2</code>.</p>`,
      example: `<p>Cost $180,000 today, then $100,000 a year for 2 years.</p>
        <p>At 5%: $100,000 × 0.9524 + $100,000 × 0.9070 − $180,000 = $5,940.</p>
        <p>At 15%: $100,000 × 0.8696 + $100,000 × 0.7561 − $180,000 = −$17,430.</p>
        <p>Same cash, higher required return: the NPV falls, here from above zero to below it.</p>`,
      valueQ: `1. What is this site’s NPV at ${pct(s.r)}?`, choiceQ: '2. Should we still build it?' };
    case 's4': return { title: `Site 4: two sites, one lease`, place: `Two locations in ${s.city} are competing for the same lease budget, so we can take only one.`, body: `
      <p><b>Site A</b> is a college food court: busy at first, but a competitor opens across the street in year 3 and the lease ends after 4 years. <b>Site B</b> is a highway travel plaza with steady traffic for 6 years. Each costs <b>${fmt(-s.aFlows[0])}</b> today. Our required return is <b>${pct(s.r)}</b>.</p>
      <p>Site A pays back its cost in ${s.aPayback.toFixed(1)} years, and Site B in ${s.bPayback.toFixed(1)}. The team has already found Site A’s NPV: <b>${fmt(s.aNpv)}</b>.</p>`,
      example: `<p>Projects X and Y each cost $100,000 today. The required return is 5%, and we can take only one.</p>
        <p>X brings in $55,000 a year for 2 years: NPV = $55,000 × (0.9524 + 0.9070) − $100,000 = $2,267.</p>
        <p>Y brings in $45,000 a year for 3 years: NPV = $45,000 × (0.9524 + 0.9070 + 0.8638) − $100,000 = $22,544.</p>
        <p>Take the one with the higher NPV: Y.</p>`,
      valueQ: `1. What is Site B’s NPV at ${pct(s.r)}?`, choiceQ: '2. Which site do we take?' };
    case 's5': return { title: `Site 5: ${s.city}`, place: 'A concourse space at the regional airport, on an 8-year lease.', body: `
      <p>Investors often ask for a site’s <b>break-even rate</b>: the required return at which its NPV is exactly zero. Finance calls it the <b>internal rate of return (IRR)</b>. If a site’s IRR is above the return we require, the site clears the bar.</p>
      <p>This site costs <b>${fmt(-s.flows[0])}</b> and brings in <b>${fmt(s.flows[1])}</b> a year for ${n} years. Drag the rate and watch the NPV.</p>`,
      example: `<p>Cost $150,000 today, then $60,000 in year 1 and $144,000 in year 2. Try a rate of 20%.</p>
        <p>Year 1: $60,000 ÷ 1.20 = $50,000.</p>
        <p>Year 2: $144,000 ÷ 1.20² = $100,000.</p>
        <p>NPV = $50,000 + $100,000 − $150,000 = $0, so the IRR is 20%.</p>`,
      choiceQ: 'Which rate is closest to this site’s IRR?' };
  }
}
function praise(s) {
  switch (s.id) {
    case 's1': return `The cash coming in is worth ${fmt(D.pvIn(s.r, s.flows))} today, against a cost of ${fmt(-s.flows[0])}. The site adds ${fmt(s.answer)} of value, so we build it.`;
    case 's2': return `Even with a slow start, the site adds ${fmt(s.answer)} of value, so we build it.`;
    case 's3': return `At ${pct(s.r)}, the same cash is worth less today, and the NPV turns negative: ${fmt(s.answer)}. A higher required return turned a yes into a no.`;
    case 's4': return `Site B adds ${fmt(s.answer)} of value, against ${fmt(s.aNpv)} for Site A. Payback favors A, but payback ignores the cash that comes after the cost is recovered.`;
    case 's5': return `The NPV crosses zero near ${s.answer}%. That is above our ${pct(s.r)} required return, so this site clears the bar.`;
  }
}

// ---------- site view ----------
function showSite(s) {
  const L = S.log[s.id], m = siteCopy(s), idx = D.STEPS.findIndex((x) => x.id === s.id) + 1;
  let html = `<p class="kicker">Step ${idx} of ${D.STEPS.length} · ${esc(D.STEPS[idx - 1].label)}</p>
    <article class="memo" aria-labelledby="t">${memoHead(L.done)}
      <h2 id="t">${esc(m.title)}</h2><p class="place">${esc(m.place)}</p>${m.body}
      <details class="example" open><summary>Worked example</summary><div class="ex-body">${m.example}</div></details>`;
  // Each question sits right above its own answer field. The calculator sits right under the table the student works in.
  if (s.kind === 'npv') html += scratchTable(s.flows, s.r, s.showFactors, 'Cash flows for this site');
  if (s.kind === 'choose') html += `<div class="pair">${plainTable(s.aFlows, 'Site A: college food court')}${plainTable(s.bFlows, 'Site B: highway travel plaza')}</div>` + scratchTable(s.bFlows, s.r, false, 'Work space for Site B (optional)');
  if (s.kind === 'irr') html += irrBlock();
  if (s.kind === 'npv' || s.kind === 'choose') html += '<div id="calcSlot"></div>';
  html += `<form class="ask" id="ask" novalidate>`;
  if (s.kind === 'guided') html += `<div class="part">${m.tableQ}${guidedTable(s, L)}<div id="calcSlot"></div></div>`;
  if (s.kind === 'npv' || s.kind === 'choose') html += `<div class="part"><label for="val">${esc(m.valueQ)}</label>
    <input class="money" id="val" inputmode="decimal" autocomplete="off" placeholder="$0" value="${L.value ? esc(L.value) : ''}" aria-describedby="valHelp">
    <p class="field-help" id="valHelp">Round to the nearest dollar. Start a negative amount with a minus sign.</p></div>`;
  if (s.decision === 'build' || s.decision === 'pass') html += `<div class="part">${radios('dec', esc(m.choiceQ), [['build', 'Build it'], ['pass', 'Pass on it']], L.choice)}</div>`;
  if (s.kind === 'choose') html += `<div class="part">${radios('dec', esc(m.choiceQ), [['A', 'Site A'], ['B', 'Site B']], L.choice)}</div>`;
  if (s.kind === 'irr') html += `<div class="part">${radios('dec', esc(m.choiceQ), s.options.map((o) => [String(o), o + '%']), L.choice)}</div>`;
  html += `<div class="actions"><button class="btn" type="submit">Check</button>
      <span class="attempts" id="att">${L.attempts ? 'Checks so far: ' + L.attempts : ''}</span></div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <div class="actions" id="helpRow" hidden></div>
    <div class="fb hint" id="helpBox" hidden></div>
    <div class="actions" id="nextRow" ${L.done ? '' : 'hidden'}><button class="btn" type="button" id="nextBtn">${nextLabel(s.id)}</button></div>
  </form></article>`;
  view.innerHTML = html;
  if ($('#calcSlot')) dockCalc($('#calcSlot'));
  wireSite(s, L);
}
function radios(name, legend, opts, current) {
  return `<fieldset><legend>${legend}</legend><div class="choices">${opts.map(([v, t]) => `<label class="choice"><input type="radio" name="${name}" value="${v}" ${current === v ? 'checked' : ''}><span>${t}</span></label>`).join('')}</div></fieldset>`;
}
function guidedTable(s, L) {
  const rows = L.rows || [];
  const body = s.flows.map((cf, t) => {
    const f = D.df(s.r, t);
    const inp = t === 0
      ? `<input id="pv0" value="${fmt(cf).replace('−', '-')}" readonly aria-describedby="y0note"><span class="mark"></span>`
      : `<label class="sr-only" for="pv${t}">Present value, year ${t}</label><input id="pv${t}" class="pvin" data-t="${t}" inputmode="decimal" autocomplete="off" value="${rows[t] ? esc(rows[t]) : ''}"><span class="mark" id="mk${t}"></span>`;
    return `<tr><td>${t}${t === 0 ? '<span class="today"> (today)</span>' : ''}</td><td class="${cf < 0 ? 'neg' : ''}">${fmt(cf)}</td><td>${f4(f)}</td><td>${inp}</td></tr>`;
  }).join('');
  return `<div class="tw"><table class="cf"><caption>Cash flows for this site, required return ${pct(s.r)}</caption>
    <thead><tr><th scope="col">Year</th><th scope="col">Cash flow</th><th scope="col">Discount factor</th><th scope="col">Present value<small>cash flow × discount factor</small></th></tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr class="total"><td colspan="3">Value today of the cash coming in (sum of the present values, years 1 to ${s.flows.length - 1})</td><td id="inTotal">$0</td></tr>
      <tr><td colspan="3">Cost today (year 0)</td><td class="neg">${fmt(s.flows[0])}</td></tr>
      <tr class="total hl"><td colspan="3"><b>NPV</b> = value today of the cash coming in − cost today</td><td id="npvTotal"><b>$0</b></td></tr></tfoot></table></div>
    <p class="small" id="y0note">Year 0 is filled in for you: the cost is paid today, its factor is 1, so its present value is the full cost.</p>`;
}
function plainTable(flows, caption) {
  return `<div class="tw"><table class="cf"><caption>${esc(caption)}</caption><thead><tr><th scope="col">Year</th><th scope="col">Cash flow</th></tr></thead><tbody>${flows.map((cf, t) => `<tr><td>${t}</td><td class="${cf < 0 ? 'neg' : ''}">${fmt(cf)}</td></tr>`).join('')}</tbody></table></div>`;
}
function scratchTable(flows, r, showFactors, caption) {
  const rows = flows.map((cf, t) => {
    const f = D.df(r, t);
    return `<tr><td>${t}${t === 0 ? '<span class="today"> (today)</span>' : ''}</td><td class="${cf < 0 ? 'neg' : ''}">${fmt(cf)}</td><td>${showFactors ? f4(f) : ''}</td>
      <td>${t === 0 ? `<input value="${fmt(cf).replace('−', '-')}" readonly aria-label="Present value, year 0">` : `<label class="sr-only" for="sp${t}">Present value, year ${t} (optional)</label><input id="sp${t}" class="spin" inputmode="decimal" autocomplete="off">`}</td></tr>`;
  }).join('');
  return `<div class="tw"><table class="cf"><caption>${esc(caption)}, required return ${pct(r)}${showFactors ? '' : '. Discount factors are not shown this time: find them in Desmos.'}</caption>
    <thead><tr><th scope="col">Year</th><th scope="col">Cash flow</th><th scope="col">Discount factor</th><th scope="col">Present value (optional)<small>cash flow × discount factor</small></th></tr></thead>
    <tbody>${rows}</tbody><tfoot><tr class="total hl"><td colspan="3">NPV = sum of the present values, including the year 0 cost</td><td><span id="spTotal">$0</span></td></tr></tfoot></table></div>
    <div class="actions"><button class="btn small secondary" type="button" id="useTotal">Use this NPV in the answer box</button></div>`;
}
function irrBlock() {
  return `<div class="slider-wrap"><label for="rate">Required return: <span class="readout" id="rateOut"></span></label>
    <input type="range" id="rate" min="0" max="30" step="0.5" value="5" aria-describedby="npvOut">
    <p class="readout" id="npvOut" aria-live="polite"></p>
    <svg class="curve" id="curve" viewBox="0 0 560 220" role="img" aria-label="NPV of this site at required returns from 0 to 30 percent"></svg></div>`;
}
function helpText(s, level) {
  const flows = s.kind === 'choose' ? s.bFlows : s.flows;
  const rowLine = (t) => `Year ${t}: ${fmt(flows[t])} × ${f4(D.df(s.r, t))} = ${fmt(flows[t] * D.df(s.r, t))}`;
  if (s.kind === 'irr') return 'Drag the slider slowly from 0% upward. The NPV shrinks as the rate rises. The rate where it reaches $0 is the break-even rate. Pick the option closest to it.';
  if (level === 1) return `Start with year 1. Its discount factor at ${pct(s.r)} is 1 ÷ (1 + ${s.r})¹ = ${f4(D.df(s.r, 1))}.<br>${rowLine(1)}.<br>Do the same for each year, then add them up and subtract the cost.`;
  const lines = flows.map((cf, t) => (t === 0 ? `Year 0: the cost, ${fmt(cf)} (factor 1)` : rowLine(t)));
  return `Here is every row:<br>${lines.join('<br>')}<br>Now add all of these together, including the negative year 0 cost. That total is the NPV.`;
}
function wireSite(s, L) {
  const form = $('#ask');
  const fb = $('#fb');
  const rowsNow = () => (s.kind === 'guided' ? [null, ...$$('.pvin').map((x) => x.value)] : null);
  // guided table: live totals
  if (s.kind === 'guided') {
    const upd = () => {
      let inS = 0;
      $$('.pvin').forEach((x) => { const v = D.parseMoney(x.value); if (isFinite(v)) inS += v; x.classList.remove('good', 'wrong'); const mk = $('#mk' + x.dataset.t); if (mk) mk.textContent = ''; });
      $('#inTotal').textContent = fmt(inS);
      $('#npvTotal').innerHTML = '<b>' + fmt(inS + s.flows[0]) + '</b>';
      // Once the site is done, edits never overwrite the rows saved for the receipt (only a right Check does).
      if (!L.done) { L.rows = rowsNow(); saveState(); }
    };
    $$('.pvin').forEach((x) => x.addEventListener('input', upd)); upd();
  }
  // scratch table
  if ($('#spTotal')) {
    const flows = s.kind === 'choose' ? s.bFlows : s.flows;
    const upd = () => { let t = flows[0]; $$('.spin').forEach((x) => { const v = D.parseMoney(x.value); if (isFinite(v)) t += v; }); $('#spTotal').textContent = fmt(t); return t; };
    $$('.spin').forEach((x) => x.addEventListener('input', upd)); upd();
    $('#useTotal').addEventListener('click', () => { $('#val').value = String(Math.round(upd())); $('#val').focus(); });
  }
  // irr slider
  if (s.kind === 'irr') {
    const rate = $('#rate'), svg = $('#curve');
    const W = 560, H = 220, P = 36;
    const vals = []; for (let k = 0; k <= 60; k++) vals.push([k / 2, D.npv(k / 200, s.flows)]);
    const ymax = Math.max(...vals.map((v) => v[1])), ymin = Math.min(...vals.map((v) => v[1]));
    const X = (x) => P + (x / 30) * (W - 2 * P), Y = (y) => P / 2 + (ymax - y) / (ymax - ymin) * (H - P * 1.5);
    const path = vals.map((v, k) => (k ? 'L' : 'M') + X(v[0]).toFixed(1) + ' ' + Y(v[1]).toFixed(1)).join(' ');
    svg.innerHTML = `<line x1="${P}" x2="${W - P}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line-strong)" stroke-dasharray="4 4"/>
      <text x="${W - P}" y="${Y(0) - 6}" text-anchor="end">NPV = $0</text>
      <path d="${path}" fill="none" stroke="var(--brand)" stroke-width="3"/>
      <text x="${P}" y="${H - 6}">0%</text><text x="${W - P}" y="${H - 6}" text-anchor="end">30%</text>
      <circle id="dot" r="7" fill="var(--ink)"/>`;
    const upd = () => {
      const r = parseFloat(rate.value) / 100, v = D.npv(r, s.flows);
      $('#rateOut').textContent = (Math.round(r * 1000) / 10) + '%';
      $('#npvOut').textContent = 'NPV at this rate: ' + fmt(v);
      const dot = $('#dot'); dot.setAttribute('cx', X(r * 100)); dot.setAttribute('cy', Y(v));
    };
    rate.addEventListener('input', upd); upd();
  }
  function renderHelp() {
    const row = $('#helpRow'); const maxLevel = s.kind === 'irr' ? 1 : 2;
    const fails = L.fails || 0; if (!fails || L.done) { row.hidden = true; return; }
    const avail = Math.min(maxLevel, fails);
    row.hidden = false;
    row.innerHTML = `<button class="btn small secondary" type="button" data-l="1">${s.kind === 'irr' ? 'Show me how' : 'Show me the first row'}</button>` +
      (avail >= 2 ? '<button class="btn small secondary" type="button" data-l="2">Show me every row</button>' : '');
    $$('button[data-l]', row).forEach((b) => b.addEventListener('click', () => {
      const lvl = Number(b.dataset.l); L.help = Math.max(L.help || 0, lvl); saveState();
      const box = $('#helpBox'); box.hidden = false; box.innerHTML = helpText(s, lvl);
    }));
  }
  renderHelp();
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = $('#val') ? $('#val').value : null;
    const ch = (form.querySelector('input[name=dec]:checked') || {}).value || null;
    const rows = rowsNow();
    const res = D.judgeSite(s, { value: val, choice: ch, rows: rows || L.rows });
    L.attempts = (L.attempts || 0) + 1;
    // A finished site keeps its right answer: a later wrong Check never overwrites what the receipt carries.
    if (res.ok || !L.done) { L.value = val; L.choice = ch; if (rows) L.rows = rows; }
    if (s.kind === 'guided' && res.rowRes) {
      res.rowRes.forEach((rr, t) => {
        if (!t) return; const x = $('#pv' + t), mk = $('#mk' + t);
        x.classList.toggle('good', rr.ok); x.classList.toggle('wrong', !rr.ok);
        mk.textContent = rr.ok ? '✓' : '✗'; mk.setAttribute('aria-label', rr.ok ? 'correct' : 'not yet');
      });
    }
    if (res.ok) {
      markDone(s.id);
      fb.className = 'fb ok'; fb.innerHTML = '<b>Right.</b> ' + praise(s);
      $('#nextRow').hidden = false; $('#helpRow').hidden = true;
      (document.querySelector('#pager [data-go]:not(.secondary)') || $('#nextBtn')).focus();
    } else {
      L.fails = (L.fails || 0) + 1;
      fb.className = 'fb bad'; fb.innerHTML = '<b>Not yet.</b> ' + esc(res.msg || 'Check your work and try again.') + (L.done ? ' Your earlier right answer is still saved.' : '');
      renderHelp();
    }
    $('#att').textContent = 'Checks so far: ' + L.attempts;
    saveState();
  });
  $('#nextBtn').addEventListener('click', () => go(nextId(s.id)));
}

// ---------- the note ----------
function showMemo() {
  const L = S.log.memo;
  const builds = S.sites.filter((s) => s.decision === 'build').length;
  view.innerHTML = `<p class="kicker">Step ${D.STEPS.length} of ${D.STEPS.length} · Your note</p>
    <article class="memo" aria-labelledby="t">${memoHead(L.done)}
      <h2 id="t">A note for the CFO</h2>
      <p>Thanks for working through these. I am sending a summary to our CFO on Friday. Write me a short note I can forward: which sites would you build, which would you pass on, and why? One thing the CFO always asks: why not just pick the site that pays back fastest?</p>
      <form id="mf" novalidate>
        <label for="memoText">Your note to ${esc(ST.vp.split(' ')[0])}</label>
        <textarea id="memoText" aria-describedby="memoHelp">${esc(S.memoDraft != null ? S.memoDraft : S.memo)}</textarea>
        <p class="field-help" id="memoHelp">Write 3 to 5 sentences (at least ${D.MEMO_MIN_WORDS} words) in your own words. This step is graded on completion, and the note prints on your receipt. <span class="wc" id="wc"></span></p>
        <div class="actions"><button class="btn" type="submit">Save my note</button></div>
        <div class="fb" id="fb" aria-live="polite"></div>
        <div class="actions" id="nextRow" ${L.done ? '' : 'hidden'}><button class="btn" type="button" id="nextBtn">Go to your receipt</button></div>
      </form></article>`;
  const ta = $('#memoText');
  const wc = () => { const n = D.wordCount(ta.value); $('#wc').textContent = n + (n === 1 ? ' word' : ' words') + ' so far.' + (L.done && ta.value !== S.memo ? ` Your saved note stays on your receipt until this one has at least ${D.MEMO_MIN_WORDS} words.` : ''); };
  // Once the note is done, a shortened draft never replaces the saved note on the receipt.
  const keep = () => { S.memoDraft = ta.value; if (!L.done || D.judgeMemo(ta.value).ok) S.memo = ta.value; };
  ta.addEventListener('input', () => { keep(); saveState(); wc(); }); wc();
  $('#mf').addEventListener('submit', (e) => {
    e.preventDefault(); keep();
    const r = D.judgeMemo(ta.value); const fb = $('#fb');
    if (r.ok) { S.memo = ta.value; markDone('memo'); fb.className = 'fb ok'; fb.innerHTML = '<b>Saved.</b> Your note will print on your receipt.'; $('#nextRow').hidden = false; wc(); }
    else { fb.className = 'fb bad'; fb.textContent = `Your note has ${r.words} words. Write at least ${D.MEMO_MIN_WORDS}: name the sites you would build and the ones you would pass on, and say why.` + (L.done ? ' Your earlier note is still saved.' : ''); }
    saveState();
  });
  $('#nextBtn').addEventListener('click', () => go('receipt'));
}

// ---------- receipt ----------
function wrapLines(g, text, maxW, maxLines) {
  const words = String(text).replace(/\s+/g, ' ').trim().split(' '); const lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) { lines.length = maxLines; lines[maxLines - 1] += ' …'; }
  return lines;
}
async function makeReceiptBlob() {
  const payload = D.makePayload(S.name, S.email, S.log, S.memo);
  const done = doneCount(), pts = D.pointsFor(done);
  const rowsN = Math.ceil(D.STEPS.length / 5), H = 1000 + rowsN * 92, ny = 430 + rowsN * 92 + 40;
  const canvas = document.createElement('canvas'); canvas.width = 1200; canvas.height = H;
  const g = canvas.getContext('2d');
  g.fillStyle = '#F7F5F0'; g.fillRect(0, 0, 1200, H);
  g.strokeStyle = '#1C6B4A'; g.lineWidth = 6; g.strokeRect(24, 24, 1152, H - 48);
  g.lineWidth = 1.5; g.strokeRect(38, 38, 1124, H - 76);
  g.fillStyle = '#1C6B4A'; g.font = 'italic 24px Georgia, serif'; g.fillText(ST.company + ' ' + ST.team + '  ·  Corporate Finance, Unit 5', 80, 100);
  g.fillStyle = '#1B211D'; g.font = '58px Georgia, serif'; g.fillText('The Site Selection Desk', 80, 172);
  g.font = '34px Georgia, serif'; g.fillText(S.name, 80, 236);
  g.fillStyle = '#5C625D'; g.font = '26px Georgia, serif'; g.fillText(S.email, 80, 276);
  // points box
  g.fillStyle = done === D.STEPS.length ? '#1C6B4A' : '#8A5A00'; g.fillRect(80, 306, 1040, 96);
  g.fillStyle = '#FFFFFF'; g.font = 'bold 44px Georgia, serif'; g.fillText('Points: ' + pts + ' / ' + D.POINTS, 108, 370);
  g.font = '24px Georgia, serif'; g.textAlign = 'right'; g.fillText(done + ' of ' + D.STEPS.length + ' steps complete · graded on completion', 1092, 366); g.textAlign = 'left';
  // steps
  const fit = (g, txt, max, px) => { let s = px; do { g.font = 'bold ' + s + 'px Georgia, serif'; s -= 1; } while (g.measureText(txt).width > max && s >= 12); };
  D.STEPS.forEach((s, k) => {
    const col = k % 5, row = Math.floor(k / 5), x = 80 + col * 209, y = 430 + row * 92, l = S.log[s.id];
    g.fillStyle = l.done ? '#E0F2E5' : '#FBE7E4'; g.fillRect(x, y, 197, 76);
    g.fillStyle = l.done ? '#1C7340' : '#A8261E'; const tl = (l.done ? '✓ ' : '✗ ') + s.label; fit(g, tl, 175, 18); g.fillText(tl, x + 16, y + 34);
    g.fillStyle = '#5C625D'; g.font = '18px Georgia, serif'; g.fillText(l.done ? 'complete' : 'not finished', x + 16, y + 60);
  });
  // note
  g.fillStyle = '#1B211D'; g.font = 'bold 24px Georgia, serif'; g.fillText('Note to the VP of Real Estate', 80, ny);
  g.font = '21px Georgia, serif'; g.fillStyle = '#1B211D';
  const lines = S.memo.trim() ? wrapLines(g, S.memo, 1040, 9) : ['(no note yet)'];
  lines.forEach((ln, i) => g.fillText(ln, 80, ny + 34 + i * 29));
  g.fillStyle = '#5C625D'; g.font = '20px Georgia, serif';
  g.fillText('Issued ' + new Date(payload.issued).toLocaleString('en-US', { dateStyle: 'long', timeStyle: 'short' }), 80, H - 142);
  g.fillStyle = '#1B211D'; g.font = 'bold 26px monospace'; g.fillText('Verification code  ' + D.shortCode(payload.sum), 80, H - 104);
  g.fillStyle = '#5C625D'; g.font = '18px Georgia, serif'; g.fillText('Instructors: enter the points shown above. To spot-check, open ' + VERIFY_URL.replace('https://', ''), 80, H - 66);
  const blob = await new Promise((res) => canvas.toBlob(res, 'image/png'));
  const bytes = new Uint8Array(await blob.arrayBuffer());
  const withText = D.addTextChunk(bytes, D.encodeReceipt(payload));
  return { blob: new Blob([withText], { type: 'image/png' }), url: canvas.toDataURL('image/png'), payload, pts, done };
}
function startPractice() {
  const k = KEY + ':practice:' + D.seedFor(S.email); const round = (Number(store.get(k)) || 0) + 1; store.set(k, round);
  S.practice = round; S.sites = D.buildSites(S.email + '#practice' + round); S.log = blankLog(); go('s1');
}
function endPractice() { const nm = S.name, em = S.email; S.practice = 0; startFor(nm, em); go('receipt'); }
function showPracticeEnd() {
  const sites = D.STEPS.filter((s) => /^s\d$/.test(s.id)), done = sites.filter((s) => S.log[s.id].done).length;
  view.innerHTML = `<p class="kicker">Practice round ${S.practice}</p><h2>You worked ${done} of ${sites.length} sites with new numbers.</h2>
    <p>Practice rounds are never graded. Your graded receipt is exactly as you left it.</p>
    <div class="actions"><button class="btn" type="button" id="again">Practice again with new numbers</button><button class="btn secondary" type="button" id="back">Back to my graded receipt</button></div>`;
  $('#again').addEventListener('click', startPractice); $('#back').addEventListener('click', endPractice);
}
async function showReceipt() {
  if (!S.email) return showStart();
  if (S.practice) return showPracticeEnd();
  const r = await makeReceiptBlob();
  const all = r.done === D.STEPS.length;
  const fileName = 'SiteSelectionDesk_' + (S.name.replace(/[^A-Za-z0-9]+/g, '') || 'Student') + '.png';
  view.innerHTML = `<p class="kicker">Your receipt</p>
    <p class="points">${r.pts} / ${D.POINTS} points</p>
    <h2>${all ? 'Every step is complete.' : 'A few steps are still open.'}</h2>
    <p>${all ? 'Download your receipt and upload it to the assignment page. That is all there is to it.' : 'This assignment is graded on completion. Finish the open steps below for full credit, then download your receipt.'}</p>
    <ul class="check">${D.STEPS.map((s) => `<li><span class="st ${S.log[s.id].done ? 'ok' : 'no'}">${S.log[s.id].done ? '✓ done' : '✗ open'}</span><span>${esc(s.label)}</span>${S.log[s.id].done ? '' : ` <button class="btn small secondary" type="button" data-go="${s.id}">Go to ${esc(s.label)}</button>`}</li>`).join('')}</ul>
    <div class="actions"><a class="btn" id="dl" download="${fileName}" href="#">Download your receipt</a></div>
    <img class="cert-preview" alt="Receipt preview: ${esc(S.name)}, ${r.pts} of ${D.POINTS} points, ${r.done} of ${D.STEPS.length} steps complete, verification code ${D.shortCode(r.payload.sum)}." src="${r.url}">
    <p class="small">The file is named ${esc(fileName)}. Upload the downloaded file itself, not a screenshot: your instructor’s checker reads data stored inside the file. If you finish more steps later, download a new receipt.</p>
    <div class="box"><p><b>Want more practice before an exam?</b> Work the sites again with new numbers. Practice rounds are not graded and do not change this receipt.</p><div class="actions"><button class="btn secondary" type="button" id="practice">Practice with new numbers</button></div></div>
    <p class="small">Not you? <a href="#" id="switch">Start over with a different email</a>.</p>`;
  $('#practice').addEventListener('click', startPractice);
  const a = $('#dl'); a.href = URL.createObjectURL(r.blob);
  $$('button[data-go]').forEach((b) => b.addEventListener('click', () => go(b.dataset.go)));
  $('#switch').addEventListener('click', (e) => { e.preventDefault(); S = { name: '', email: '', sites: [], log: {}, memo: '', at: 'start' }; store.set(KEY + ':last', null); showStart(); });
}

// ---------- boot ----------
const last = store.get(KEY + ':last');
const lastSaved = last ? store.get(KEY + ':' + D.seedFor(last)) : null;
if (lastSaved && lastSaved.name) { startFor(lastSaved.name, lastSaved.email); go(S.at && S.at !== 'start' ? S.at : 'walk'); }
else showStart();

// ---------- self-checks ----------
SelfCheck.register('engine loaded', () => !!(window.Desk && Desk.buildSites) || { ok: false, detail: 'desk-core.js missing' });
SelfCheck.register('sites generate for a test email', () => {
  const ss = Desk.buildSites('selfcheck@example.edu');
  return (ss.length === 5 && ss[0].answer > 0 && ss[2].answer < 0 && ss[3].answer > ss[3].aNpv) || { ok: false, detail: 'unexpected site set' };
});
SelfCheck.register('judging marks right and wrong answers correctly', () => {
  for (const s of Desk.buildSites('selfcheck@example.edu')) {
    let good, bad;
    if (s.kind === 'irr') { good = { choice: String(s.answer) }; bad = { choice: String(s.answer + 4) }; }
    else if (s.kind === 'guided') { const rows = s.flows.map((cf, t) => String(Math.round(cf * Desk.df(s.r, t)))); good = { rows, choice: s.decision }; const r2 = rows.slice(); r2[1] = String(s.flows[1]); bad = { rows: r2, choice: s.decision }; }
    else { good = { value: String(Math.round(s.answer)), choice: s.decision }; bad = { value: String(Math.round(s.answer) + 50000), choice: s.decision }; }
    if (!Desk.judgeSite(s, good).ok) return { ok: false, detail: s.id + ' rejects its own answer' };
    if (Desk.judgeSite(s, bad).ok) return { ok: false, detail: s.id + ' accepts a wrong answer' };
  }
  return true;
});
SelfCheck.register('calculator evaluates a discount factor', () => Math.abs(Desk.calc('330000/(1.08)^5').value - 224592.455) < 0.01 || { ok: false, detail: 'calc wrong' });
SelfCheck.register('a page view rendered', () => view.textContent.trim().length > 200 || { ok: false, detail: 'view is empty' });
SelfCheck.register('receipt PNG round-trips its payload', async () => {
  const ss = Desk.buildSites('selfcheck@example.edu'); const log = { walk: { done: true }, memo: { done: true } }; Desk.STEPS.filter((x) => x.quiz != null).forEach((x) => { log[x.id] = { done: true, choice: Desk.QUIZ[x.quiz].answer }; });
  for (const s of ss) {
    if (s.kind === 'irr') log[s.id] = { done: true, choice: String(s.answer) };
    else if (s.kind === 'guided') log[s.id] = { done: true, rows: s.flows.map((cf, t) => String(Math.round(cf * Desk.df(s.r, t)))), choice: s.decision };
    else log[s.id] = { done: true, value: String(Math.round(s.answer)), choice: s.decision };
  }
  const p = Desk.makePayload('Self Check', 'selfcheck@example.edu', log, 'word '.repeat(40));
  const cv = document.createElement('canvas'); cv.width = 20; cv.height = 20;
  const blob = await new Promise((res) => cv.toBlob(res, 'image/png'));
  const bytes = Desk.addTextChunk(new Uint8Array(await blob.arrayBuffer()), Desk.encodeReceipt(p));
  const v = Desk.verifyPayload(Desk.decodeReceipt(Desk.readTextChunk(bytes)));
  return (v.checksumOk && v.done === Desk.STEPS.length && v.points === 20) || { ok: false, detail: 'round trip failed: ' + JSON.stringify(v.problems) };
});
})();
